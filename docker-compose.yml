version: "3.8"
services:
  api:
    build: .
    container_name: app-backend # Đặt tên cố định để dễ quản lý
    ports:
      - "4000:4000"
    env_file:
      - .env # Chắc chắn file .env đã có DATABASE_URL trỏ về host.docker.internal
    volumes:
      - .:/app
      - /app/node_modules
    command: yarn dev
    networks:
      - app-network
    restart: unless-stopped # THÊM DÒNG NÀY

networks:
  app-network:
    external: true
